# 3.1 预测任务定义、固定划分与验证基线 · notebook 导读
# 这一步当时用脚本执行并已验收；nb_3.1.ipynb 是从划分表和原始 CSV 重算关键数字、和当时产物核对的复核 notebook。
step: "3.1"
revision: r01
notebook: nb_3.1.ipynb

brief:
  background: 2.1 看到理化指标里有和评分有关的信息，于是决定尝试预测 quality。尝试之前要先固定三件事：数据怎么切分、误差怎么计算、模型和谁比较。
  question: 数据怎么切分才公平？「准」怎么计算？不看理化指标能猜多准？
  answer: 每类酒切成训练、验证、最终评估三份；不看指标、一律猜 6 分的基线，在红酒验证集上平均差 0.6435 分。
  can_continue: true
  did: 按特征组合分层、用固定种子把每类酒切成三份，只在验证行上计算训练集中位数的误差。
  next: 7.1 用同一个验证集比较 Ridge 和随机森林两个预定候选。

parts:
  - question: 三份是怎么切的？切得公平吗？
    answer: 红酒训练 950 行、验证 331 行、最终评估 318 行；白酒 2921、983、994 行。同一个特征组合的行都在同一份里，跨划分的组合是 0 个。
    meaning: 11 个化验值完全相同的行可能来自同一份酒，如果分到两边，模型等于提前看到了答案；整组同进同出就防止了这种情况。
    cells:
      - cell: 2
        title: 读入划分表
        what: 读入 3.1 当时产出的划分表 split_assignments.csv，它记录每条原始行的酒类、源文件行号、特征组合 ID 和所属的那一份。
        why: 划分表是后面所有模型试验共用的切分依据；这里先确认它覆盖了全部原始行。
        read: 输出「划分表 6,497 行 = 红酒 1,599 + 白酒 4,898：True」，说明每条原始行在划分表里都有对应记录，没有遗漏也没有多出来的行。
        lines:
          - line: 25
            note: 划分表只有四列，不含 quality 和理化指标，防止有人把它当作数据来用。
      - cell: 3
        title: 统计三份的行数，检查有没有跨划分
        what: 按源文件行号把原始行和划分表合并，统计每一份的行数和特征组合数，检查有没有特征组合跨划分、有没有组合内 quality 不一致。
        why: 行数对得上说明划分表没有丢行；跨划分为 0 才能说「相同的输入没有同时出现在两边」。
        read: 红酒训练 950 行、验证 331 行、最终评估 318 行，共 1359 个特征组合；白酒 2921、983、994 行，3961 个组合。「跨划分的组合」和「quality 不一致的组合」两列都是 0。最后一行确认这些数与当时的 split_summary.json 一致。
        lines:
          - line: 5
            note: 一个特征组合出现在不止一份里，就算跨划分。
          - line: 10
            note: 每一份的行数和组合数都要和当时记录的一致，否则报错。
  - question: 不看理化指标能猜多准？
    answer: 一律猜训练集的中位数 6 分：红酒验证集平均差 0.6435 分，白酒 0.6368 分。
    meaning: 这是后面每个模型都要超过的比较基准；一个模型如果不能把误差降到 0.64 以下，就说明理化指标没有带来信息。
    cells:
      - cell: 4
        title: 只用训练行定基线，只在验证行上计算误差
        what: 用训练行 quality 的中位数作为每一行的预测值，对验证行计算 MAE 和 RMSE，断言结果与当时保存的 baseline_validation.json 一致。
        why: 基线要和后面的模型用同一批验证行、同一种误差算法，比较才公平；最终评估行一行都不使用。
        read: 两类酒的训练集中位数都是 6.0；验证 MAE 红酒 0.6435、白酒 0.6368，RMSE 分别是 0.8777、0.9033。最后一行给了一个具体例子：红酒第 1 行在验证集里，真值 5，基线猜 6.0，绝对差 1.0，这个 1.0 就是 331 行 MAE 里的一项。
        lines:
          - line: 5
            note: 中位数只用训练行计算，验证行不参与。
          - line: 6
            note: 每一行的误差是真值和 6.0 的绝对差，MAE 是这些绝对差的平均。

terms:
  - term: 划分表
    plain: 3.1 产出的一张表，写明每条原始行属于训练、验证还是最终评估；后面所有步骤都按它切分数据。
  - term: 跨划分
    plain: 同一个特征组合的行被分到了两份里；本项目要求这种情况为 0。

cannot_say:
  - 不能说验证集代表未来的酒：数据没有采集时间，划分只是按分值分层的随机抽取。
  - 不能说理化指标有预测收益：基线还没有被任何候选模型比较过。
  - 最终评估集不是完全未接触的数据：2.1 的全量探索看过它，只是还没有被任何模型计分。
