# 3.1 预测任务定义、固定划分与验证基线 · notebook 导读
# 这一步当时用脚本执行并已验收；nb_3.1.ipynb 是从划分表和原始 CSV 重算关键数字、和当时产物对账的复核 notebook。
step: "3.1"
revision: r01
notebook: nb_3.1.ipynb

brief:
  background: 2.1 看到理化指标里有信息，决定试着预测 quality。试之前要先把「怎么切数据、怎么算准不准、和谁比」定死，不然后面的模型比较没有公平的尺子。
  question: 数据怎么切才公平？「准」怎么算？不看理化指标能猜多准？
  answer: 每类酒切成训练、验证、最终评估三份；一律猜 6 分的基线在验证集上平均差 0.6435。
  can_continue: true
  did: 按特征组合分层、固定种子把每类酒切成三份，只在验证行上算训练集中位数的误差。
  next: 7.1 用同一验证集比较 Ridge 和随机森林两个预定候选。

parts:
  - question: 三份是怎么切的？切得公平吗？
    answer: 红酒训练 950、验证 331、最终评估 318 行；白酒 2921、983、994。同一个特征组合的行都在同一份里，跨划分为 0。
    meaning: 11 个化验值完全相同的行可能是同一份酒，放在两边会让模型「见过答案」；整组同进同出就堵住了这个口子。
    cells:
      - cell: 2
        title: 读划分表
        what: 读 3.1 当时产出的划分表：每条原始行的酒类、源文件行号、特征组合 ID、属于哪一份。
        why: 划分表是后面所有模型试验共用的尺子；这里先确认它覆盖了全部原始行。
        read: 划分表 6,497 行 = 红酒 1,599 + 白酒 4,898，True。
        lines:
          - line: 25
            note: 划分表只有四列，不含 quality 和理化指标，防止被当成数据用。
        data:
          title: 划分表长这样
          note: 3.1 的产物，平台现取前 5 行。
          frames:
            - label: 划分表
              file: steps/03_数据划分/3.1_预测任务定义_固定划分与验证基线/outputs/split_assignments.csv
              columns: [wine, source_row, feature_group_id, split]
              limit: 5
              mark:
                columns: [split]
              caption: 红酒第 1 行在 validation；第 2 行在 training。feature_group_id 是 11 个化验值拼起来的哈希。
      - cell: 3
        title: 数三份的行数，查有没有跨划分
        what: 把原始行和划分表合上，数每份的行数和特征组合数，查有没有组合跨划分、有没有组合内 quality 不一致。
        why: 行数对上说明划分表没丢行；跨划分为 0 才能说「相同输入没有同时出现在两边」。
        read: 红酒 950 / 331 / 318 行、1359 个特征组合；白酒 2921 / 983 / 994、3961 个；跨划分和 quality 不一致都是 0，与当时的 split_summary.json 一致。
        lines:
          - line: 5
            note: 一个特征组合出现在不止一份里就算跨划分。
          - line: 10
            note: 每份的行数和组合数都要和当时记的一致。
  - question: 不看理化指标能猜多准？
    answer: 一律猜训练集的中位数 6 分：红酒验证集平均差 0.6435，白酒 0.6368。
    meaning: 这是后面每个模型都要跨过的门槛；一个模型如果连 0.64 都压不下去，理化指标就没带来信息。
    cells:
      - cell: 4
        title: 只用训练行定基线，只在验证行上打分
        what: 训练行 quality 的中位数当预测值，对验证行算 MAE 和 RMSE，和当时的基线产物断言一致。
        why: 基线要和后面的模型用同一批验证行、同一个算法算误差，才有可比性；最终评估行一行不碰。
        read: 两类酒的中位数都是 6.0；验证 MAE 红酒 0.6435、白酒 0.6368，RMSE 0.8777、0.9033。红酒第 1 行在验证集，真值 5，猜 6 差 1.0。
        lines:
          - line: 5
            note: 中位数只从训练行算，验证行不参与。
          - line: 6
            note: 每行的误差就是真值和 6.0 的绝对差；MAE 是这些差的平均。

terms:
  - term: 划分表
    plain: 3.1 产出的一张表，写明每条原始行属于训练、验证还是最终评估；后面所有步骤照它切数据。
  - term: 跨划分
    plain: 同一个特征组合的行分到了两份里；本项目要求这种情况为 0。

cannot_say:
  - 不能说验证集代表未来的酒：没有采集时间，划分只是随机分层。
  - 不能说理化指标有预测收益：基线还没被任何候选比过。
  - 最终评估集不是完全未接触：2.1 的全量探索看过它，只是还没被模型计分。
