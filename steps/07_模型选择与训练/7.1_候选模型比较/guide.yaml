# 7.1 候选模型比较 · notebook 导读
# 读者：懂业务、懂技术原理、能读代码，但没做过数据科学的负责人。
step: "7.1"
revision: r01
notebook: nb_7.1.ipynb

brief:
  background: 3.1 定好了划分和基线：不看理化指标、一律猜 6 分，验证集平均差 0.64 分。这一步第一次让理化指标上场。
  question: 拿 11 个理化指标去猜 quality，能比一律猜 6 分更准吗？准多少？
  answer: 能。两类酒、两个候选都更准，随机森林最准：红酒平均差 0.5051 分。
  can_continue: true
  did: 只用训练行拟合两个候选，在验证行上和基线比误差，再重抽样看差距稳不稳。
  next: 9.1 把四个候选在封存的最终评估集上各评一次；10.1 看模型主要靠哪些指标。

parts:
  - question: 候选比基线准多少？这个差距稳不稳？
    answer: 红酒随机森林把平均差从 0.6435 降到 0.5051，白酒从 0.6368 降到 0.5474；四个候选的区间上界都在 0 以下。
    meaning: 理化指标确实带来了信息，红酒比白酒明显；但这还是验证集上的成绩，候选就是在这批行上挑出来的，最终数字要看 9.1。
    cells:
      - cell: 3
        title: 先把 3.1 的划分和基线对上
        what: 把每条原始行和划分表合上，只留训练行和验证行；用训练行的中位数重算基线，要和 3.1 一模一样。
        why: 后面所有比较都建立在「同一批验证行、同一个基线」上；对不上就说明数据或口径变了，不能往下走。
        read: 红酒训练 950 行、验证 331 行（274 个特征组合），最终评估 318 行封存没碰；白酒 2,921、983、994。基线 MAE 0.6435 和 0.6368，和 3.1 完全一致。
        lines:
          - line: 5
            note: 同一个特征组合的行必须在同一份里，这一行断言它没跨划分。
            mark: {columns: [feature_group_id, split]}
          - line: 11
            note: 基线就是训练行 quality 的中位数，两类酒都是 6。
          - line: 14
            note: 和 3.1 存的基线比，差过一千亿分之一就停。
        data:
          title: 划分表长这样
          note: 3.1 的产物，平台现取前 5 行。
          frames:
            - label: 划分表
              file: steps/03_数据划分/3.1_预测任务定义_固定划分与验证基线/outputs/split_assignments.csv
              columns: [wine, source_row, feature_group_id, split]
              limit: 5
              mark:
                columns: [split]
              caption: 每条原始行按酒类和源文件行号对应到训练 / 验证 / 最终评估之一；表里没有 quality，也没有理化指标。
      - cell: 4
        title: 拟合两个候选，只在验证行上打分
        what: 每类酒各拟合一个 Ridge 和一个随机森林，参数写死；对验证行输出连续预测，算 MAE、RMSE 和相对基线的差。
        why: 两个候选一个线性、一个非线性，覆盖两种假设；参数固定、不反复调，验证集才能只当裁判。
        read: 表里四行就是四个候选。红酒随机森林 MAE 0.5051、Ridge 0.5194，基线 0.6435；白酒随机森林 0.5474、Ridge 0.5814，基线 0.6368。RMSE 也都低于基线。
        lines:
          - line: 11
            note: 标准化的均值和标准差只从训练行算，验证行套用同一组数，避免偷看。
          - line: 14
            note: Ridge 在标准化后的全部指标上拟合，alpha=1.0。
          - line: 15
            note: 随机森林 300 棵树、每片叶子至少 5 行、种子固定。
        data:
          title: 验证预测表：每个候选对每条验证行的预测
          note: 本步产物，平台现取前 5 行。
          frames:
            - label: 验证预测表
              file: steps/07_模型选择与训练/7.1_候选模型比较/outputs/validation_predictions.csv
              columns: [wine, source_row, candidate, quality, prediction, baseline_prediction, abs_error, baseline_abs_error]
              limit: 5
              mark:
                columns: [prediction, abs_error]
              caption: 红酒第 1 行真值 5，基线猜 6 差 1.0；候选给的是连续值，误差是它和真值的绝对差。
      - cell: 5
        title: 重抽样看差距稳不稳
        what: 把验证集的特征组合有放回地抽 2,000 次，每次算一遍「候选 MAE − 基线 MAE」，取 2.5% 和 97.5% 分位数。
        why: 一个 MAE 差可能是这批行凑巧；换一批组合再算 2,000 次，看差值会不会跑到 0 以上。
        read: 四个区间的上界都小于 0：红酒随机森林 [-0.2130, -0.0663]，白酒随机森林 [-0.1335, -0.0458]。红酒的区间离 0 更远，改善更稳。
        lines:
          - line: 12
            note: 随机数生成器和种子写死，谁来重算都是同一批抽样。
          - line: 18
            note: 一个组合抽中几次，它的全部验证行就计几次，按行数求 MAE。
  - question: 模型在哪些分值上反而不如基线？
    answer: quality 恰好是 6 的行：基线猜 6 误差为 0，模型在这些行上必输；模型赢在 5 分和 7 分。
    meaning: 平均误差下降不等于每一行都更准。给一批中等的酒打分，基线已经够用；理化指标的价值在把偏低、偏高的酒分开。
    cells:
      - cell: 6
        title: 按分值拆开看，再套门槛
        what: 按 quality 分值算每个候选和基线的平均误差，最后按计划的三条门槛判断哪些候选可以登记。
        why: 平均数会掩盖分值间的差异；门槛写在计划里，结果出来后不许改。
        read: 红酒 6 分 137 行基线误差 0.0，Ridge 0.4124、随机森林 0.4495；红酒 5 分 135 行基线 1.0，随机森林 0.3587。两端分值行数只有个位数，误差在 2 分上下。四个候选都满足登记门槛。
        lines:
          - line: 15
            note: 三条门槛缺一不可：MAE 低于基线、区间上界小于 0、RMSE 不高于基线。

terms:
  - term: 候选
    plain: 计划里预先定好的两种模型配置，参数写死；先在验证集上和基线比，过了门槛才有资格进最终评估。
  - term: 标准化
    plain: 把每个指标减去训练行的均值、再除以训练行的标准差，让 11 个量纲不同的指标可以放在一起比。
  - term: 连续预测
    plain: 模型给出的是 5.37 这样的小数，不取整也不截断到 0～10；误差按小数算。
  - term: 分位数
    plain: 把 2,000 个差值从小到大排，2.5% 分位数就是排在 2.5% 位置的那个值；两头各切 2.5%，中间就是区间。

cannot_say:
  - 不能说这是生产可用的收益：没有业务成本依据，门槛只是研究筛选。
  - 不能说对未来的酒有效：候选是在验证集上筛出来的，最终数字要看 9.1，而最终评估集在 2.1 被全量探索看过。
  - 不能说随机森林一定比 Ridge 好：两者的区间大幅重叠，本步没有在它们之间取舍。
