# 7.1 候选模型比较 · notebook 导读
step: "7.1"
revision: r01
notebook: nb_7.1.ipynb

brief:
  background: 3.1 固定了数据划分和基线：不看理化指标、一律猜 6 分，验证集上平均差 0.64 分。这一步第一次让 11 个理化指标参与预测。
  question: 用 11 个理化指标预测 quality，能比一律猜 6 分更准吗？准多少？
  answer: 能。两类酒的两个候选都比基线更准，随机森林最准：红酒验证集平均差 0.5051 分。
  can_continue: true
  did: 只用训练行拟合两个候选模型，在验证行上和基线比较误差，再用重抽样检查差距是否稳定。
  next: 9.1 把四个候选在封存的最终评估集上各评估一次；10.1 分析模型主要依赖哪些指标。

parts:
  - question: 候选比基线准多少？这个差距稳不稳？
    answer: 红酒随机森林把验证集 MAE 从 0.6435 降到 0.5051，白酒从 0.6368 降到 0.5474；四个候选的重抽样区间上界都小于 0。
    meaning: 理化指标确实带来了信息，红酒的改善比白酒明显；但这还是验证集上的成绩，候选就是在这批行上选出来的，最终数字要看 9.1。
    cells:
      - cell: 3
        title: 先核对 3.1 的划分表和基线
        what: 按源文件行号把每条原始行和划分表合并，只保留训练行和验证行；用训练行 quality 的中位数重算基线，核对它的验证集 MAE 与 3.1 保存的结果是否一致。
        why: 后面所有比较都建立在「同一批验证行、同一个基线」上；核对不一致就说明数据或计算方式变了，不能继续。
        read: 红酒训练 950 行、验证 331 行（274 个特征组合），最终评估 318 行封存没有使用；白酒对应 2,921、983、994 行。基线 MAE 红酒 0.6435、白酒 0.6368，和 3.1 的结果完全一致，说明这里用的验证行和基线就是 3.1 定下的那一套。
        lines:
          - line: 5
            note: 同一个特征组合的行必须在同一份里，这一行断言没有组合跨划分。
          - line: 11
            note: 基线就是训练行 quality 的中位数，两类酒都是 6。
          - line: 14
            note: 重算的基线与 3.1 保存的值相差超过一千亿分之一就停止。
      - cell: 4
        title: 拟合两个候选，只在验证行上评分
        what: 每类酒各拟合一个 Ridge 和一个随机森林，参数固定；对验证行输出连续预测值，计算 MAE、RMSE 以及相对基线的差。
        why: 两个候选一个是线性模型、一个是非线性模型，覆盖两种假设；参数固定、不反复调整，验证集才只承担评判的角色。
        read: 表里四行就是四个候选。红酒随机森林 MAE 0.5051、Ridge 0.5194，基线 0.6435；白酒随机森林 0.5474、Ridge 0.5814，基线 0.6368。四个候选的 RMSE 也都低于基线的 0.8777 和 0.9033，说明大误差也变少了，不只是平均误差变小。
        lines:
          - line: 11
            note: 标准化用的均值和标准差只从训练行计算，验证行套用同一组数，避免用到验证行的信息。
          - line: 14
            note: Ridge 在标准化后的全部指标上拟合，alpha=1.0。
          - line: 15
            note: 随机森林用 300 棵树、每片叶子至少 5 行、随机种子固定。
      - cell: 5
        title: 用重抽样检查差距是否稳定
        what: 把验证集的特征组合有放回地抽两千次，每次计算一遍「候选 MAE − 基线 MAE」，取 2.5% 和 97.5% 分位数作为区间。
        why: 一个 MAE 差可能只是这批验证行凑巧；换一批组合重算两千次，能看出差值会不会跑到 0 以上。
        read: 四个区间的上界都小于 0：红酒随机森林 [-0.2130, -0.0663]，白酒随机森林 [-0.1335, -0.0458]。红酒的区间离 0 更远，改善更稳定；白酒 Ridge 的上界 -0.0191 离 0 最近，改善最弱。
        lines:
          - line: 12
            note: 随机数生成器和种子固定，任何人重算都会得到同一批抽样。
          - line: 18
            note: 一个组合被抽中几次，它的全部验证行就计算几次，按行数求 MAE。
  - question: 模型在哪些分值上反而不如基线？
    answer: 在 quality 恰好是 6 的行上：基线猜 6 分的误差为 0，模型在这些行上的误差一定更大；模型在 5 分和 7 分的行上误差更低。
    meaning: 平均误差下降不等于每一行都更准。给一批中等评分的酒打分，基线已经够用；理化指标的价值在于把偏低和偏高的酒区分出来。
    cells:
      - cell: 6
        title: 按分值拆开看，再套用登记门槛
        what: 按 quality 分值计算每个候选和基线的平均误差，最后按计划里的三条登记门槛判断哪些候选可以登记。
        why: 平均数会掩盖分值之间的差异；登记门槛写在计划里，结果出来之后不允许修改。
        read: 红酒 6 分 137 行的基线误差是 0.0，Ridge 是 0.4124、随机森林 0.4495；红酒 5 分 135 行的基线误差 1.0，随机森林只有 0.3587。两端分值的行数只有个位数，误差在 2 分上下，只描述不下结论。最后的判定：四个候选都满足登记门槛。
        lines:
          - line: 15
            note: 三条登记门槛缺一不可：MAE 低于基线、区间上界小于 0、RMSE 不高于基线。

terms:
  - term: 候选
    plain: 计划里预先定好的两种模型配置，参数固定；先在验证集上和基线比较，满足登记门槛的才有资格进入最终评估。
  - term: 标准化
    plain: 把每个指标减去训练行的均值、再除以训练行的标准差，让 11 个量纲不同的指标可以放在一起比较。
  - term: 连续预测
    plain: 模型输出的是 5.37 这样的小数，不取整也不截断到 0～10；误差按小数计算。
  - term: 分位数
    plain: 把两千个差值从小到大排列，2.5% 分位数就是排在 2.5% 位置的那个值；两头各切掉 2.5%，中间就是区间。

cannot_say:
  - 不能说这是生产可用的收益：没有业务成本依据，登记门槛只是研究筛选。
  - 不能说对未来的酒有效：候选是在验证集上选出来的，最终数字要看 9.1，而最终评估集在 2.1 被全量探索看过。
  - 不能说随机森林一定比 Ridge 好：两者的区间大幅重叠，本步没有在它们之间取舍。
