# 11.1 模型登记与交付清单 · notebook 导读
step: "11.1"
revision: r01
notebook: nb_11.1.ipynb

brief:
  background: 9.1 确定了每类酒最准的模型是随机森林，10.1 说清了它主要依赖 alcohol。剩下的工作是把模型登记成版本，写清楚怎么使用、不能用在哪里。
  question: 交出去的到底是哪个文件？怎么使用？能用在哪里？什么情况下要回头重新训练？
  answer: 每类酒登记一个随机森林候选版本，附打分脚本和交付清单；打分脚本对 20 条示例记录全部输出了估计值。
  can_continue: true
  did: 按最终评估结果选出候选并登记版本，用子进程真实运行一遍打分脚本，再填写交付清单。
  next: 你在「模型与交付」页查看清单，决定验收或打回；要上线先确定部署方式。

parts:
  - question: 登记的是哪个文件？打分脚本真的能用吗？
    answer: 登记的是 7.1 产出的两个随机森林文件（版本 8314f626bc19 和 32bfb8ca1cde）；打分脚本对每类酒的 10 行示例各输出了 10 行结果。
    meaning: 版本号是文件内容的哈希，以后任何人拿到的文件对不对，一比就知道；打分脚本是通过命令行真实运行的，不是「理论上能用」。
    cells:
      - cell: 2
        title: 按 9.1 的结果选出候选
        what: 读入 9.1 的最终评估结果，每类酒取 MAE 最低的候选并断言它是随机森林；把候选名称、模型文件哈希和最终评估 MAE 记录到这次运行里。
        why: 选哪个模型不由这一步决定，只按 9.1 的数字执行；文件哈希记录下来，交付清单才能核对文件没有被替换。
        read: 输出一行「每类酒登记的候选」，红酒和白酒都是随机森林。这一格没有再计算任何指标，只是读取 9.1 的 final_evaluation.json 并做记录。
        lines:
          - line: 25
            note: 每类酒在四个候选里取最终评估 MAE 最低的那个。
          - line: 38
            note: 把 9.1 的最终评估指标记录到这次运行里，交付清单的指标栏从这里取数，不重新计算。
      - cell: 3
        title: 用子进程真实运行打分脚本
        what: 取每类酒最终评估集的前 10 行、只保留 11 个指标列写成输入文件，通过命令行调用 predict.py，再读回输出文件核对行数。
        why: 使用者拿到的是命令行脚本；只有真的从命令行运行成功，才能说它可以使用。
        read: 两行「10 行已打分」说明红酒、白酒各输出了 10 行。示例表里 red 第 3 行 alcohol 9.8、quality_估计 5.146、真值 5；第 8 行估计 4.980 但真值是 7，说明单条记录的误差可以达到 2 分，估计值只适合批量粗筛或排序。
        lines:
          - line: 10
            note: 输入文件只有 11 个指标列，没有 quality 列。
          - line: 11
            note: 通过子进程调用脚本，和使用者在命令行里敲命令走的是同一条路。
          - line: 15
            note: 输出行数必须等于输入行数，估计值不能有空值。
      - cell: 4
        title: 登记为模型版本
        what: 用 SDK 把两个模型文件登记为模型版本，状态是候选；打分脚本也登记为这一步的产物。
        why: 登记之后，平台会把训练数据版本、代码版本和指标关联到这个版本上，验收和交付的状态也在这个版本上变更。
        read: 两行「登记 … 版本 …（候选）」，版本号是文件哈希的前十二位。最后一行的结论里写了两个版本各自的最终评估 MAE：红酒 0.4963、白酒 0.5752。
        lines:
          - line: 4
            note: 相同内容的文件只算一个版本；重新训练的结果会成为新版本，不覆盖旧版本。

terms:
  - term: 候选版本
    plain: 登记到平台但还没有被人验收的模型版本；升到「已验收」「已交付」要写理由，由负责人在平台上操作。
  - term: 打分脚本
    plain: 一条命令：输入一份理化指标 CSV，输出每一行的 quality 估计值；红酒和白酒各用各的模型。
  - term: 交付清单
    plain: 一份 YAML 文件：写明模型版本、复现步骤、训练数据、指标含义、适用范围、监控方案和未解决的问题；平台逐项核对。

cannot_say:
  - 不能说模型已经验收或可以交付：状态是候选，由你决定。
  - 不能说估计值等于专家评分：单条记录的误差可以超过 2 分，估计值适合批量粗筛或排序。
  - 没有生产场景和业务成本依据，「优于基线」不等于「值得使用」。
