# 11.1 模型登记与交付清单 · notebook 导读
step: "11.1"
revision: r01
notebook: nb_11.1.ipynb

brief:
  background: 9.1 定了每类酒最准的是随机森林，10.1 说清了它主要靠 alcohol。剩下的是把模型登记成版本、写清怎么用和不能用在哪。
  question: 交出去的到底是哪个文件、怎么用、能用在哪、什么时候该回头重训？
  answer: 每类酒登记一个随机森林候选版本，附打分入口和交付清单；示例打分 20 行跑通。
  can_continue: true
  did: 取最终评估最准的候选登记版本，用子进程真跑一遍打分入口，再填交付清单。
  next: 你在「模型与交付」页看清单，决定验收或打回；要上线先定部署方式。

parts:
  - question: 登记的是哪个文件？打分入口真的能用吗？
    answer: 登记的就是 7.1 的两个随机森林文件（版本 8314f626bc19、32bfb8ca1cde）；打分入口对每类酒 10 行示例各输出 10 行。
    meaning: 版本号是文件内容的哈希，以后谁拿到的文件对不对、一比就知道；入口是子进程真跑的，不是「理论上能用」。
    cells:
      - cell: 2
        title: 按 9.1 的结果选候选
        what: 读 9.1 的最终评估结果，每类酒取 MAE 最低的候选，断言是随机森林；把候选、文件哈希和最终评估 MAE 记进运行记录。
        why: 选哪个不由这一步拍板，只照 9.1 的数字执行；哈希记下来，交付清单才能核对文件没换。
        read: 输出一行：每类酒登记的候选都是随机森林。
        lines:
          - line: 25
            note: 每类酒在四个候选里取最终评估 MAE 最低的那个。
          - line: 38
            note: 把 9.1 的最终评估指标带进这次运行，交付清单的指标栏从这里取数，不重算。
      - cell: 3
        title: 用子进程真跑一遍打分入口
        what: 取每类酒最终评估集前 10 行、只留 11 个指标列写成输入文件，用命令行调用 predict.py，再读回输出核对行数。
        why: 别人拿到的是命令行入口；只有真的从命令行跑通，才能说它能用。
        read: 两行「10 行已打分」，示例表里 red 第 3 行 alcohol 9.8、估计 5.146、真值 5；第 8 行估计 4.980 但真值 7——单条误差可以很大。
        lines:
          - line: 10
            note: 输入文件只有 11 个指标列，没有 quality。
          - line: 11
            note: 通过子进程调用，和用户在命令行里敲的是同一条路。
          - line: 15
            note: 输出行数必须等于输入行数，估计值不能有空。
        data:
          title: 示例打分结果
          note: 本步产物，平台现取前 6 行；quality 只是对照，不是新的评估。
          frames:
            - label: 示例打分
              file: steps/11_部署与交付/11.1_模型登记与交付清单/outputs/scoring_example.csv
              columns: [wine, source_row, alcohol, quality_估计, quality]
              limit: 6
              mark:
                columns: [quality_估计]
              caption: quality_估计是连续值，不取整；和真值一比，5 分的酒估在 5 上下，7 分的那行估成了 4.98。
      - cell: 4
        title: 登记为模型版本
        what: 用 SDK 把两个模型文件登记为版本，状态是候选；打分脚本也登记为产物。
        why: 登记之后，平台把训练数据版本、代码版本、指标都挂在这个版本上，验收和交付的状态也在这上面流转。
        read: 两行「登记 … 版本 …（候选）」，版本号就是文件哈希的前十二位。
        lines:
          - line: 4
            note: 同样内容的文件只算一个版本；重新训练的结果会成为新版本，不覆盖。

terms:
  - term: 候选版本
    plain: 登记进平台但还没被人验收的模型版本；升到「已验收」「已交付」要写理由，由负责人在平台上操作。
  - term: 打分入口
    plain: 一条命令：给一份理化指标 CSV，输出每行的 quality 估计；红酒、白酒各用各的模型。
  - term: 交付清单
    plain: 一份 YAML：模型版本、怎么复现、用什么数据、指标口径、能用在哪、怎么监控、还有什么没解决；平台逐项核对。

cannot_say:
  - 不能说模型已验收或可交付：状态是候选，由你决定。
  - 不能说估计值等于专家评分：单条误差可以到 2 分以上，适合批量粗筛或排序。
  - 没有生产场景与业务成本依据，「优于基线」不等于「值得使用」。
