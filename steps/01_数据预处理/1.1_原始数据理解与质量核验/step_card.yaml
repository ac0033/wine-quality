step: "1.1"
revision: r01
headline: 两份原始 CSV 可以直接用：红酒 1,599 行、白酒 4,898 行，12 列齐全，没有空值和无效值；同值行只计数不删
can_continue: true
core_numbers:
  - label: 红酒行数
    after: 1599
    scope: winequality-red.csv 的数据行（不含表头）
    source: "outputs/data_profile.json#/files/red/rows"
  - label: 白酒行数
    after: 4898
    scope: winequality-white.csv 的数据行（不含表头）
    source: "outputs/data_profile.json#/files/white/rows"
  - label: 红酒同值行
    after: 240
    scope: 12 个字段原始文本完全相同的行，每组不计首次出现；占 1,599 行的 15.01%
    source: "outputs/data_profile.json#/files/red/exact_duplicate_rows_beyond_first"
  - label: 白酒同值行
    after: 937
    scope: 同上；占 4,898 行的 19.13%
    source: "outputs/data_profile.json#/files/white/exact_duplicate_rows_beyond_first"
operation: 分别按分号读入两份 CSV，逐列核对表头和字段说明，数空值、无法解析的数、非有限值、quality 超出 0～10 的行和同值行；分酒类列出 quality 每个分值的行数。
exceptions:
  - 同值行不能当作重复采集删掉：原始文件没有样本 ID、采集时间，判断不了它们是不是同一份酒
  - quality 只出现 3～9 分，两端很少：红酒 3 分 10 行、8 分 18 行；白酒 9 分只有 5 行
artifacts:
  - {path: outputs/data_profile.json, purpose: 逐文件的输入指纹、表结构、质量检查和 quality 分布，2.1 的起点, kind: table}
  - {path: report.md, purpose: 给用户看的报告, kind: report}
  - {path: acceptance.md, purpose: 主 agent 的验收结论, kind: report}
why: 后面所有分析都建立在「每行是一份酒、每列是什么」这个理解上；先把行数、字段和质量问题固定下来，后面出了数才有地方对账。
invariants:
  - 三份原始文件执行前后字节数与 SHA256 一致
  - 每个分值的行数加起来等于该文件的行数
evidence:
  - {path: checks/verification.json, purpose: 独立复核 49/49 项通过：从原始字节重算行数、表头、quality 频数、空值、同值行, kind: table}
can_say:
  - 两份 CSV 的字段与 winequality.names 的 11 个理化指标 + quality 一一对应
  - 没有任何一行需要填补或删除
cannot_say:
  - 不能说同值行是重复采集
  - 结论只对这两份 CSV 成立，不推广到所有葡萄酒
next: 2.1 分红酒、白酒看理化指标的分布和它们与 quality 的关系。
examples:
  - title: 红酒第 1 条记录怎么被计数
    input: "7.4;0.7;0;1.9;0.076;11;34;0.9978;3.51;0.56;9.4;5"
    rule: 按分号切成 12 列，末列 quality=5，计入红酒 5 分
    output: 红酒 5 分共 681 行，占 42.59%
    artifact: outputs/data_profile.json
    real: true
