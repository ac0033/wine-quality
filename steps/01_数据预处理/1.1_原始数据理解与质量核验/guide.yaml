# 1.1 原始数据理解与质量核验 · notebook 导读
# 这一步当时用脚本执行并已验收；nb_1.1.ipynb 是从原始 CSV 重算关键数字、和当时产物核对的复核 notebook，讲解围绕它讲。
step: "1.1"
revision: r01
notebook: nb_1.1.ipynb

brief:
  background: 项目从两份原始 CSV 起步：红酒一份、白酒一份，每一行是一份酒的 11 个化验值加专家评分 quality。做分析之前，先要弄清每行每列是什么、数据里有没有空值和无效值。
  question: 这两份 CSV 能不能直接拿来分析？每行每列到底是什么？
  answer: 两份 CSV 可以直接用：红酒有 1,599 行，字段和字段说明一一对应，没有空值和无效值。
  can_continue: true
  did: 按分号读入两份文件，核对表头、空值和同值行，再统计每个分值各有多少行。
  next: 2.1 分红酒、白酒看 11 个理化指标的分布，以及每个指标和 quality 的关系。

parts:
  - question: 数据干不干净？
    answer: 红酒 1,599 行、白酒 4,898 行都是 12 列，空值 0 行、quality 超出范围 0 行；同值行红酒 240 行、白酒 937 行，只计数不删。
    meaning: 数据不需要清洗，后面的每一步都直接用全部原始行；同值行保留，因为没有样本 ID，删掉可能删掉真实存在的不同样本。
    cells:
      - cell: 2
        title: 按分号读入，核对表头
        what: 用分号作分隔符读入两份 CSV，核对读出来的列名是不是字段说明里的 11 个理化指标加 quality。
        why: 分隔符读错的话整张表会变成一列；列名和字段说明对不上，说明拿到的文件版本不对。
        read: 输出两行：红酒 1,599 行 × 12 列、白酒 4,898 行 × 12 列，两份的表头核对结果都是 True。行数和 winequality.names 里写的 1599、4898 一致，说明文件完整，没有多读或少读行。
        lines:
          - line: 22
            note: 按数值类型读一份，用来统计行数、空值和 quality 的分布。
          - line: 23
            note: 再按原始文本读一份，专门用来数同值行；同值行按 12 个字段的原文完全相同来判断。
      - cell: 3
        title: 逐项和当时的产物核对
        what: 统计每类酒的行数、空值数、quality 超出 0～10 的行数和同值行数，逐项断言它们等于 1.1 当时保存的 data_profile.json 里的值。
        why: 复核不是把当时的脚本再跑一遍，而是用另一条路径（pandas）算同样的数；两边对不上就说明当时的产物或现在的文件有一个变了。
        read: 表里「行数」「同值行」两列和「当时记的行数」「当时记的同值行」完全一样：红酒 1599 行、240 行同值行，白酒 4898 行、937 行同值行；空值和 quality 超范围的行都是 0。最后一行「和 1.1 当时的产物逐项一致」说明所有断言都通过了。
        lines:
          - line: 4
            note: duplicated() 按文本列判断，每组同值行不计首次出现的那一行。
          - line: 7
            note: 行数或同值行数和当时记录的不一致时，这一行直接报错停下。
  - question: 专家评分是怎么分布的？
    answer: 两类酒都集中在 5、6 分：红酒 5 分占 42.59%、6 分占 39.90%；两端很少，白酒 9 分只有 5 行。
    meaning: 后面无论是看相关关系还是建模，两端分值的样本都太少，结论主要说的是中间分值的酒。
    cells:
      - cell: 4
        title: 每个分值多少行
        what: 按 quality 分组统计每类酒各分值的行数和占比，并断言各分值行数加起来等于该文件的总行数。
        why: 分值的分布决定后面「一律猜 6 分」这种基线好不好用，也提醒两端分值不能下结论。
        read: 红酒 3 分只有 10 行、8 分 18 行；白酒 9 分只有 5 行。红酒 5 分 681 行占 42.59%，白酒 6 分 2198 行占 44.88%。两类酒的 5 分和 6 分加起来都超过七成，所以后面的模型主要是在区分中间分值的酒。

terms:
  - term: 字段说明
    plain: data/winequality.names 这份文本文件，写了每一列是什么、quality 是怎么打出来的。
  - term: 表头
    plain: CSV 文件的第一行，也就是 12 个列名。

cannot_say:
  - 不能说同值行是重复采集：文件里没有样本 ID，判断不了两行是不是同一份酒。
  - 这些结论只对这两份 CSV 成立，不能推广到所有葡萄酒。
