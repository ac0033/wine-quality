    input: 白酒最终评估集 994 行，Ridge MAE 0.6194，基线 0.6469，差 -0.0275
    rule: 把 794 个特征组合有放回重抽 2,000 次，差值的 2.5%～97.5% 区间是 [-0.0637, 0.0107]
    output: 上界大于 0，说明换一批组合差值可能变成正的，按 7.1 的口径不算稳定改善
    artifact: outputs/final_evaluation.json
    real: true
