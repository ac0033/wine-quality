    source: "outputs/final_evaluation.json#/files/red/baseline/mae"
operation: 从划分表取每类酒的最终评估行，原样加载 7.1 的四个模型文件各预测一次；和同一批行上的训练集中位数基线比 MAE / RMSE；重抽样区间算法与 7.1 相同；不重训、不回头改 7.1。
exceptions:
  - 白酒 Ridge 的差值区间上界 +0.0107 跨过 0：验证集上的改善没有在最终评估集上复现
  - 白酒两个候选在最终评估集上都比验证集差 0.03～0.04；红酒反而略好，主要是这批行 quality=6 占比低、基线更差
  - 两端分值行数只有个位数（红酒 3 分 2 行、8 分 4 行，白酒 9 分 1 行），误差在 1.2～2.9 分，只描述
artifacts:
  - {path: outputs/final_evaluation.json, purpose: 每类酒每候选的最终评估 MAE / RMSE、差值、区间、按分值误差，并列 7.1 的验证集 MAE, kind: table}
  - {path: outputs/final_predictions.csv, purpose: 每个候选对每条最终评估行的唯一一次预测, kind: table}
  - {path: outputs/bootstrap_mae_differences.csv, purpose: 最终评估集重抽样每次每候选的 MAE 配对差, kind: table}
  - {path: report.md, purpose: 给用户看的报告, kind: report}
  - {path: acceptance.md, purpose: 验收报告, kind: report}
why: 候选是在验证集上选出来的，验证集上的数字偏乐观；只有换一批没参与过拟合和筛选的行，才知道改善是不是真的。
invariants:
  - 11 份输入执行前后 SHA256 一致；模型文件哈希与 7.1 产物一致
  - 每个候选对每条最终评估行恰好一条预测；训练行、验证行一行没用
  - 每个候选只评这一次
evidence:
  - {path: checks/verification.json, purpose: 独立复核：从原始 CSV 与逐行预测重算全部指标与区间，三处故障注入均被拒绝, kind: table}
can_say:
  - 红酒上理化指标的收益仍然成立：两个候选的区间都远离 0
  - 白酒上随机森林的收益仍然成立，Ridge 不再成立
cannot_say:
  - 不能说对未来的酒有效：最终评估行在 2.1 被全量探索看过，不是外部数据
  - 不能说值得部署：没有业务成本依据
next: 10.1 看模型主要靠哪些指标；11.1 每类酒登记随机森林为候选模型并写交付清单，是否验收由你决定。
examples:
