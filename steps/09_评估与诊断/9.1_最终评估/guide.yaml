# 9.1 最终评估 · notebook 导读
step: "9.1"
revision: r01
notebook: nb_9.1.ipynb

brief:
  background: 7.1 的四个候选都是在验证集上挑出来的，成绩偏乐观。3.1 封存的最终评估集到现在还没被任何模型碰过。
  question: 换一批模型没见过、也没参与挑选的行，理化指标带来的改善还在吗？
  answer: 红酒两个候选和白酒随机森林还在，白酒 Ridge 没站住；红酒随机森林差 0.4963。
  can_continue: true
  did: 原样加载四个模型，对最终评估行各预测一次，和同一批行上的基线比，再重抽样看区间。
  next: 10.1 看模型靠哪些指标；11.1 每类酒登记随机森林为候选，是否验收由你定。

parts:
  - question: 改善还在吗？和验证集上比差多少？
    answer: 红酒随机森林最终评估 MAE 0.4963（基线 0.6855），白酒 0.5752（基线 0.6469）；白酒 Ridge 的区间上界变成 +0.0107。
    meaning: 红酒的收益站得住，白酒只有随机森林站得住。这是每个候选唯一的一次最终评估，数字不会再刷新。
    cells:
      - cell: 3
        title: 只取最终评估行，模型原样用
        what: 从划分表挑出最终评估行，训练行和验证行只数个数；四个模型从 7.1 的文件加载，直接预测。
        why: 这一步不许有任何 fit：模型一改，就等于又在最终评估集上挑了一次。
        read: 最终评估行红酒 318、白酒 994。红酒随机森林 MAE 0.4963、验证集 0.5051；白酒随机森林 0.5752、验证集 0.5474。基线在红酒上变差到 0.6855。
        lines:
          - line: 5
            note: 只留划分表里标为 final_evaluation 的行。
          - line: 7
            note: 基线预测直接沿用 7.1 记录的训练集中位数，不重算。
          - line: 17
            note: 有标准化参数的是 Ridge，套用训练行的均值和标准差；随机森林直接预测。
        data:
          title: 最终预测表：每个候选对每条最终评估行的唯一一次预测
          note: 本步产物，平台现取前 5 行。
          frames:
            - label: 最终预测表
              file: steps/09_评估与诊断/9.1_最终评估/outputs/final_predictions.csv
              columns: [wine, source_row, candidate, quality, prediction, baseline_prediction, abs_error, baseline_abs_error]
              limit: 5
              mark:
                columns: [prediction, abs_error]
              caption: 和 7.1 的验证预测表同一个格式，只是行换成了最终评估行。
      - cell: 4
        title: 重抽样看区间
        what: 把最终评估集的特征组合有放回地抽两千次，算「候选 MAE − 基线 MAE」的 2.5% 和 97.5% 分位数。
        why: 和 7.1 用同一把尺子，才能说「站住」还是「没站住」。
        read: 红酒随机森林 [-0.2642, -0.1145]，白酒随机森林 [-0.1120, -0.0313]，都在 0 以下；白酒 Ridge [-0.0637, 0.0107] 跨过 0。
        lines:
          - line: 14
            note: 种子和生成器与 7.1 相同，换的只是抽样对象。
  - question: 红酒为什么反而比验证集好一点？
    answer: 这批行里 quality=6 的占比低，一律猜 6 分的基线差得更多；模型的误差本身没怎么变。
    meaning: 比较要看「和基线的差」，别只看模型自己的 MAE 变高变低。
    cells:
      - cell: 5
        title: 按分值拆开，再定「仍优于基线」
        what: 按 quality 分值算每个候选和基线的误差；用 MAE 低于基线且区间上界小于 0 两条判定。
        why: 分值表能看出模型赢在哪、输在哪；判定规则和 7.1 一致，不能事后放松。
        read: 红酒 6 分 119 行基线误差 0.0，随机森林 0.4613；红酒 5 分 141 行基线 1.0，随机森林 0.3262。白酒 Ridge 仍优于基线：否，其余三个：是。
        lines:
          - line: 13
            note: 判定只看两条：MAE 更低、区间上界小于 0。

terms:
  - term: 站住
    plain: 换一批行再算，改善还在（区间整体在 0 以下）；跨过 0 就叫没站住。
  - term: 只评一次
    plain: 最终评估集只能用这一回；看了结果再改模型，它就变成第二个验证集了。

cannot_say:
  - 不能说对未来的酒有效：最终评估行在 2.1 的全量探索里被看过分布与相关，不是外部数据。
  - 不能说值得部署：没有业务成本依据，「优于基线」不等于「有用」。
  - 不能说 Ridge 对白酒没用：它的 MAE 仍低于基线，只是这批行上看不出稳定改善。
