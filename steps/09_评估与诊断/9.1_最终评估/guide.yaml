# 9.1 最终评估 · notebook 导读
step: "9.1"
revision: r01
notebook: nb_9.1.ipynb

brief:
  background: 7.1 的四个候选都是在验证集上选出来的，验证集上的成绩偏乐观。3.1 封存的最终评估集到现在还没有被任何模型使用过。
  question: 换一批模型没见过、也没参与过选择的行，理化指标带来的改善还在吗？
  answer: 红酒的两个候选和白酒随机森林的改善仍然成立，白酒 Ridge 的改善不再成立；红酒随机森林平均差 0.4963 分。
  can_continue: true
  did: 原样加载四个模型，对最终评估行各预测一次，和同一批行上的基线比较，再用重抽样计算区间。
  next: 10.1 分析模型主要依赖哪些指标；11.1 每类酒把随机森林登记为候选模型，是否验收由你决定。

parts:
  - question: 改善还在吗？和验证集上比差多少？
    answer: 红酒随机森林的最终评估 MAE 是 0.4963（基线 0.6855），白酒随机森林 0.5752（基线 0.6469）；白酒 Ridge 的区间上界变成 +0.0107，改善不再成立。
    meaning: 红酒的收益在新的一批行上仍然成立，白酒只有随机森林成立。这是每个候选唯一的一次最终评估，数字不会再刷新。
    cells:
      - cell: 3
        title: 只取最终评估行，模型原样使用
        what: 从划分表里取出最终评估行，训练行和验证行只统计数量；四个模型从 7.1 的文件加载，直接对最终评估行预测。
        why: 这一步不允许有任何 fit 调用：模型一旦改动，就等于又在最终评估集上做了一次选择。
        read: 最终评估行红酒 318、白酒 994。红酒随机森林 MAE 0.4963，比它在验证集上的 0.5051 还低一点；白酒随机森林 0.5752，比验证集上的 0.5474 高了一些。基线在红酒上变差到 0.6855，因为这批行里 6 分的酒占比更低，一律猜 6 分的误差更大。
        lines:
          - line: 5
            note: 只保留划分表里标为 final_evaluation 的行。
          - line: 7
            note: 基线预测直接沿用 7.1 记录的训练集中位数，不重新计算。
          - line: 17
            note: 带标准化参数的是 Ridge，套用训练行的均值和标准差；随机森林直接预测。
      - cell: 4
        title: 用重抽样计算区间
        what: 把最终评估集的特征组合有放回地抽两千次，计算「候选 MAE − 基线 MAE」的 2.5% 和 97.5% 分位数。
        why: 和 7.1 用同一种评价方法，才能用同样的标准判断改善是否成立。
        read: 红酒随机森林的区间是 [-0.2642, -0.1145]，白酒随机森林 [-0.1120, -0.0313]，两者都在 0 以下；白酒 Ridge 的区间 [-0.0637, 0.0107] 跨过 0，说明换一批组合重算时它的误差可能不比基线低。
        lines:
          - line: 14
            note: 随机种子和生成器与 7.1 相同，换的只是抽样对象。
  - question: 红酒为什么反而比验证集好一点？
    answer: 这批行里 quality=6 的占比低，一律猜 6 分的基线误差更大；模型本身的误差没有明显变化。
    meaning: 比较要看「和基线的差」，不能只看模型自己的 MAE 变高还是变低。
    cells:
      - cell: 5
        title: 按分值拆开，再判定「仍优于基线」
        what: 按 quality 分值计算每个候选和基线的误差；用「MAE 低于基线」和「区间上界小于 0」两条判定改善是否仍然成立。
        why: 分值表能看出模型在哪些分值上误差更低、在哪些分值上更高；判定规则和 7.1 保持一致，不能事后放松。
        read: 红酒 6 分 119 行的基线误差是 0.0，随机森林 0.4613；红酒 5 分 141 行的基线误差 1.0，随机森林 0.3262。判定结果：白酒 Ridge 仍优于基线是「否」，其余三个是「是」。每类酒最终评估 MAE 最低的候选都是随机森林。
        lines:
          - line: 13
            note: 判定只看两条：MAE 更低，并且区间上界小于 0。

terms:
  - term: 改善成立
    plain: 换一批行重新计算，候选的误差仍然低于基线，并且重抽样区间整体在 0 以下；区间跨过 0 就叫改善不成立。
  - term: 只评一次
    plain: 最终评估集只能使用这一回；看了结果再改模型，它就变成了第二个验证集。

cannot_say:
  - 不能说对未来的酒有效：最终评估行在 2.1 的全量探索里被看过分布与相关，不是外部数据。
  - 不能说值得部署：没有业务成本依据，「优于基线」不等于「有用」。
  - 不能说 Ridge 对白酒没用：它的 MAE 仍低于基线，只是在这批行上看不出稳定的改善。
